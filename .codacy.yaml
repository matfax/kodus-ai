---
# Codacy Cloud file exclusions. While this file exists, the "Ignored files"
# settings in the Codacy UI no longer apply.
# Codacy ignores `.*libs/.*` by default as third-party code; here libs/ is the
# whole backend, so include it explicitly.
include_paths:
  - "libs/**"
exclude_paths:
  # Committed eval-run output and snapshot copies of the repo at past commits.
  - "evals/review-rounds/results/**"
  - "evals/review-rounds/fixtures/**"
  # Generated by scripts/openapi/newman-summary.js.
  - "docs-internal/openapi.newman-summary.md"
  # Enterprise code under its own license: not ours to change, so not ours
  # to analyse.
  - "libs/ee/**"
  - "apps/web/src/features/ee/**"
engines:
  # Jest describe/it callbacks are long by nature.
  lizard:
    exclude_paths:
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.e2e-spec.ts"
      - "**/__tests__/**"
  # Tests and dev tooling read files and require modules by variable path by
  # design; ESLint 9 with the project config still lints them.
  eslint-8:
    exclude_paths:
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.e2e-spec.ts"
      - "**/__tests__/**"
      - "test/**"
      - "tests/**"
      - "evals/**"
      - "scripts/**"
  # Same dev-tooling paths as eslint-8; Trivy and Checkov still scan them for
  # secrets. package.json ranges are pinned by the committed pnpm lockfiles
  # (every CI install uses --frozen-lockfile).
  opengrep:
    exclude_paths:
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.e2e-spec.ts"
      - "**/__tests__/**"
      - "test/**"
      - "tests/**"
      - "evals/**"
      - "scripts/**"
      - "package.json"
      - "**/package.json"
  # Synthetic credential corpus for the secret-scanner benchmark.
  trivy:
    exclude_paths:
      - "scripts/security-benchmark/**"
