name: CodeQL

# Advanced setup in place of GitHub's default setup, only so the enterprise
# paths can be excluded (.github/codeql/codeql-config.yml). Same languages and
# query suite as the default setup, and the same /language:<x> categories, so
# existing alerts carry over instead of reopening. Default setup must be
# switched off in the repository settings: GitHub rejects advanced-setup
# results while it is on.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '27 4 * * 1'

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript, python]
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false

            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  config-file: ./.github/codeql/codeql-config.yml

            - uses: github/codeql-action/analyze@v4
              with:
                  category: /language:${{ matrix.language }}
