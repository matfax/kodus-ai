# SonarCloud automatic analysis reads this file.
# Enterprise code under its own license (license_ee.md: any ee/ directory or
# .ee. file name): not ours to change, so not ours to analyse. Test files are
# matched by sonar.test.exclusions, not sonar.exclusions, so both are set.
sonar.exclusions=**/ee/**,**/*.ee.*
sonar.test.exclusions=**/ee/**,**/*.ee.*
